name: Daily Rheumatology Hatena Post

on:
  schedule:
    # 予備を含めて3回起動する。最初の成功後は同日分を自動スキップ。
    # 23:17 UTC = 翌日 08:17 JST
    - cron: "17 23 * * *"
    # 23:47 UTC = 翌日 08:47 JST
    - cron: "47 23 * * *"
    # 00:17 UTC = 09:17 JST
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-rheum-hatena
  cancel-in-progress: false

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TZ: Asia/Tokyo
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      HATENA_ID: ${{ secrets.HATENA_ID }}
      HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}

      HATENA_BLOG_ID: ${{ vars.HATENA_BLOG_ID || 'ctd-gim.hatenablog.com' }}
      HATENA_DRAFT: ${{ vars.HATENA_DRAFT || 'yes' }}

      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4-mini' }}
      OPENAI_MAX_TOOL_CALLS: ${{ vars.OPENAI_MAX_TOOL_CALLS || '2' }}
      OPENAI_MAX_OUTPUT_TOKENS: ${{ vars.OPENAI_MAX_OUTPUT_TOKENS || '4500' }}
      OPENAI_SEARCH_CONTEXT: ${{ vars.OPENAI_SEARCH_CONTEXT || 'medium' }}
      OPENAI_REASONING_EFFORT: ${{ vars.OPENAI_REASONING_EFFORT || 'low' }}
      OPENAI_VERBOSITY: ${{ vars.OPENAI_VERBOSITY || 'medium' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Check whether today's article is already posted
        id: today_check
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          today = datetime.now(ZoneInfo("Asia/Tokyo")).date().isoformat()
          path = Path("history.json")
          already_posted = False

          if path.exists():
              try:
                  history = json.loads(path.read_text(encoding="utf-8"))
                  already_posted = any(
                      str(post.get("date", "")) == today
                      and bool(post.get("url"))
                      for post in history.get("posts", [])
                  )
              except (json.JSONDecodeError, OSError):
                  already_posted = False

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"already_posted={'true' if already_posted else 'false'}\n")

          print(f"today={today}, already_posted={already_posted}")
          PY

      - name: Install dependencies
        if: steps.today_check.outputs.already_posted != 'true'
        run: pip install -r requirements.txt

      - name: Validate required secrets
        if: steps.today_check.outputs.already_posted != 'true'
        shell: bash
        run: |
          set -euo pipefail
          for name in OPENAI_API_KEY HATENA_ID HATENA_API_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Secret: $name" >&2
              exit 1
            fi
          done

      - name: Generate today's article
        if: steps.today_check.outputs.already_posted != 'true'
        run: python generate_article.py

      - name: Post to Hatena Blog
        if: steps.today_check.outputs.already_posted != 'true'
        run: python post_hatena.py

      - name: Archive article and history
        if: steps.today_check.outputs.already_posted != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add history.json articles/ 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No archive changes to commit."
          else
            git commit -m "Archive daily rheumatology post $(date +%F)"
            git push
          fi

      - name: Already posted today
        if: steps.today_check.outputs.already_posted == 'true'
        run: echo "Today's Hatena article is already recorded in history.json; skipping duplicate post."
