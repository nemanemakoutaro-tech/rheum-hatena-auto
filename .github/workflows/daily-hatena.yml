name: Daily Rheumatology Hatena Post

on:
  schedule:
    # 23:17 UTC = 翌日 08:17 JST
    # 毎時00分のGitHub Actions混雑を避ける
    - cron: "17 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-rheum-hatena
  cancel-in-progress: false

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TZ: Asia/Tokyo
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      HATENA_ID: ${{ secrets.HATENA_ID }}
      HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}

      HATENA_BLOG_ID: ${{ vars.HATENA_BLOG_ID || 'ctd-gim.hatenablog.com' }}
      HATENA_DRAFT: ${{ vars.HATENA_DRAFT || 'yes' }}

      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4-mini' }}
      OPENAI_MAX_TOOL_CALLS: ${{ vars.OPENAI_MAX_TOOL_CALLS || '2' }}
      OPENAI_MAX_OUTPUT_TOKENS: ${{ vars.OPENAI_MAX_OUTPUT_TOKENS || '4500' }}
      OPENAI_SEARCH_CONTEXT: ${{ vars.OPENAI_SEARCH_CONTEXT || 'medium' }}
      OPENAI_REASONING_EFFORT: ${{ vars.OPENAI_REASONING_EFFORT || 'low' }}
      OPENAI_VERBOSITY: ${{ vars.OPENAI_VERBOSITY || 'medium' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in OPENAI_API_KEY HATENA_ID HATENA_API_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Secret: $name" >&2
              exit 1
            fi
          done

      - name: Generate today's article
        run: python generate_article.py

      - name: Post to Hatena Blog
        run: python post_hatena.py

      - name: Archive article and history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add history.json articles/ 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No archive changes to commit."
          else
            git commit -m "Archive daily rheumatology post $(date +%F)"
            git push
          fi
